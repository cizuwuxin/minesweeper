<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扫雷</title>
  <meta name="theme-color" content="#F2E7F0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236750A4'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --md-sys-color-primary: #6750A4;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #EADDFF;
      --md-sys-color-on-primary-fixed-variant: #4F378B;
      --md-sys-color-secondary-container: #E8DEF8;
      --md-sys-color-on-secondary-container: #1D192B;
      --md-sys-color-tertiary-container: #FFD8E4;
      --md-sys-color-error: #B3261E;
      --md-sys-color-error-container: #F9DEDC;
      --md-sys-color-on-error-container: #410E0B;
      --md-sys-color-background: #F2E7F0;
      --md-sys-color-on-background: #332B38;
      --md-sys-color-on-surface: #332B38;
      --md-sys-color-surface-dim: #E0CFDD;
      --md-sys-color-surface-bright: #F6ECF4;
      --md-sys-color-on-surface-variant: #5C4F61;
      --md-sys-color-surface-container-lowest: #FBF3F9;
      --md-sys-color-surface-container-low: #F0E2ED;
      --md-sys-color-surface-container: #EBDAE8;
      --md-sys-color-surface-container-high: #E4CFE0;
      --md-sys-color-surface-container-highest: #DCC4D8;
      --md-sys-color-outline: #79747E;
      --md-sys-color-outline-variant: #CAC4D0;
      --md-sys-shape-corner-medium: 12px;
      --md-sys-shape-corner-full: 999px;
      --md-ease: cubic-bezier(.2,0,0,1);
      --bg: var(--md-sys-color-background);
      --fg: var(--md-sys-color-on-background);
      --muted: var(--md-sys-color-on-surface-variant);
      --accent: var(--md-sys-color-primary);
      --accent-hover: var(--md-sys-color-on-primary-fixed-variant);
      --border: var(--md-sys-color-outline-variant);
      --area-bg: linear-gradient(160deg,color-mix(in srgb,var(--md-sys-color-surface-bright) 94%,var(--md-sys-color-primary) 4%) 0%,color-mix(in srgb,var(--md-sys-color-surface-dim) 96%,var(--md-sys-color-primary) 3%) 100%);
      --wrap-bg: var(--md-sys-color-surface-container-low);
      --hidden: var(--md-sys-color-surface-container-high);
      --open: var(--md-sys-color-surface-container-lowest);
      --hover: var(--md-sys-color-surface-dim);
      --mine-bg: var(--md-sys-color-error-container);
      --mine-fg: var(--md-sys-color-on-error-container);
      --boom: var(--md-sys-color-error);
      --flag: #E53935;
      --wrong: color-mix(in srgb,var(--md-sys-color-error) 16%,var(--md-sys-color-surface-container-high));
      --success: #2E7D32;
      --warn: #E65100;
      --warn-soft: #FFF3E0;
      --board-gap: 1.5;
      --cell-border: rgba(51,43,56,.09);
      --board-pad: 8px;
      --radius-cell: 10px;
      --n1: #1565C0;
      --n2: #2E7D32;
      --n3: #C62828;
      --n4: #6A1B9A;
      --n5: #AD1457;
      --n6: #00695C;
      --n7: #37474F;
      --n8: #546E7A;
    }

    body.dark {
      color-scheme: dark;
      --cell-border: rgba(230,224,233,.09);
      --md-sys-color-primary: #D0BCFF;
      --md-sys-color-on-primary: #381E72;
      --md-sys-color-primary-container: #4F378B;
      --md-sys-color-on-primary-fixed-variant: #4F378B;
      --md-sys-color-secondary-container: #4A4458;
      --md-sys-color-on-secondary-container: #E8DEF8;
      --md-sys-color-tertiary-container: #633B48;
      --md-sys-color-error: #F2B8B5;
      --md-sys-color-error-container: #8C1D18;
      --md-sys-color-on-error-container: #F9DEDC;
      --md-sys-color-background: #141218;
      --md-sys-color-on-background: #E6E0E9;
      --md-sys-color-on-surface: #E6E0E9;
      --md-sys-color-surface-dim: #141218;
      --md-sys-color-surface-bright: #3B383E;
      --md-sys-color-on-surface-variant: #CAC4D0;
      --md-sys-color-surface-container-lowest: #0F0D13;
      --md-sys-color-surface-container-low: #1D1B20;
      --md-sys-color-surface-container: #211F26;
      --md-sys-color-surface-container-high: #2B2930;
      --md-sys-color-surface-container-highest: #36343B;
      --md-sys-color-outline: #938F99;
      --md-sys-color-outline-variant: #49454F;
      --bg: var(--md-sys-color-background);
      --fg: var(--md-sys-color-on-background);
      --muted: var(--md-sys-color-on-surface-variant);
      --accent: var(--md-sys-color-primary);
      --accent-hover: #B69DF8;
      --border: var(--md-sys-color-outline-variant);
      --area-bg: linear-gradient(160deg,color-mix(in srgb,var(--md-sys-color-surface-dim) 94%,var(--md-sys-color-primary) 6%) 0%,color-mix(in srgb,var(--md-sys-color-surface-container-low) 96%,var(--md-sys-color-primary) 4%) 100%);
      --wrap-bg: var(--md-sys-color-surface-container-low);
      --hidden: var(--md-sys-color-surface-container-high);
      --open: var(--md-sys-color-surface-container-lowest);
      --hover: var(--md-sys-color-surface-bright);
      --mine-bg: var(--md-sys-color-error-container);
      --mine-fg: var(--md-sys-color-on-error-container);
      --boom: #B3261E;
      --flag: #EF4444;
      --wrong: color-mix(in srgb,var(--md-sys-color-error) 16%,var(--md-sys-color-surface-container-high));
      --success: #81C784;
      --warn: #FDD663;
      --warn-soft: #3E2723;
      --n1: #82B1FF;
      --n2: #81C784;
      --n3: #EF9A9A;
      --n4: #CE93D8;
      --n5: #F48FB1;
      --n6: #4DB6AC;
      --n7: #B0BEC5;
      --n8: #90A4AE;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    body {
      overscroll-behavior: none;
      margin: 0;
      min-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-family: system-ui,-apple-system,Segoe UI,Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif;
      background: var(--bg);
      color: var(--fg);
      user-select: none;
      -webkit-user-select: none;
      transition: background-color .2s var(--md-ease),color .2s var(--md-ease);
    }

    button,
    input {
      font: inherit;
    }

    .btn {
      position: relative;
      min-height: 34px;
      border: 1px solid var(--md-sys-color-outline);
      border-radius: var(--md-sys-shape-corner-full);
      background: 0 0;
      color: var(--md-sys-color-primary);
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      transition: background-color .16s var(--md-ease),box-shadow .16s var(--md-ease),transform .1s var(--md-ease);
    }

    .btn:hover {
      background: color-mix(in srgb,var(--md-sys-color-primary) 8%,transparent);
    }

    .btn:active {
      transform: scale(.96);
      background: color-mix(in srgb,var(--md-sys-color-primary) 12%,transparent);
    }

    .btn-primary,
    .btn.active {
      border-color: var(--md-sys-color-primary);
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      box-shadow: 0 1px 2px #0000002e;
    }

    .btn-primary:hover,
    .btn.active:hover {
      background: var(--accent-hover);
    }

    .icon-btn {
      width: 36px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:disabled {
      opacity: .38;
      cursor: default;
      pointer-events: none;
    }

    .btn-close {
      background: 0 0;
      border: 0;
      color: var(--muted);
      width: 32px;
      height: 32px;
      border-radius: var(--md-sys-shape-corner-full);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
    }

    .btn-close:hover {
      background: color-mix(in srgb,var(--md-sys-color-on-surface) 8%,transparent);
      color: var(--fg);
    }

    #top-bar {
      z-index: 10;
      flex-shrink: 0;
      min-height: 56px;
      padding: 8px 14px;
      background: var(--md-sys-color-surface-container-low);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      box-shadow: 0 1px 2px #0000000f;
    }

    #top-bar-actions,
    #top-bar-stats {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #top-bar-stats {
      flex: 1;
      min-width: 0;
    }

    #top-bar-actions {
      flex-shrink: 0;
    }

    .stat-item {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px 8px;
      border: 0;
      border-radius: var(--md-sys-shape-corner-medium);
      background: var(--md-sys-color-surface-container);
      font-size: 11px;
      color: var(--muted);
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stat-value {
      min-width: 20px;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      color: var(--fg);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      font-size: 10px;
      color: var(--muted);
      margin-top: 1px;
    }

    .stat-item svg {
      flex-shrink: 0;
    }

    .cs {
      font-size: .58em;
      font-weight: 700;
      opacity: .72;
      margin-left: 1px;
      vertical-align: .05em;
    }

    #progress-container {
      flex-shrink: 0;
      height: 3px;
      background: var(--md-sys-color-surface-container-high);
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      width: 100%;
      transform: scaleX(0);
      transform-origin: 0 50%;
      background: linear-gradient(90deg,var(--accent),var(--success));
      transition: transform .28s var(--md-ease);
    }

    #progress-bar.full {
      background: linear-gradient(90deg,var(--success),#4caf50);
    }

    #warning-bar {
      flex-shrink: 0;
      z-index: 9;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 12px;
      border-bottom: 1px solid color-mix(in srgb,var(--warn) 45%,transparent);
      background: var(--warn-soft);
      color: color-mix(in srgb,var(--warn) 45%,var(--fg));
      font-size: 12px;
      font-weight: 600;
    }

    [hidden] {
      display: none!important;
    }

    #btn-close-warning {
      border: 0;
      background: 0 0;
      color: inherit;
      cursor: pointer;
      border-radius: var(--md-sys-shape-corner-full);
    }

    .num-1 {
      color: var(--n1);
    }

    .num-2 {
      color: var(--n2);
    }

    .num-3 {
      color: var(--n3);
    }

    .num-4 {
      color: var(--n4);
    }

    .num-5 {
      color: var(--n5);
    }

    .num-6 {
      color: var(--n6);
    }

    .num-7 {
      color: var(--n7);
    }

    .num-8 {
      color: var(--n8);
    }

    #game-area {
      flex: 1;
      width: 100%;
      overflow: hidden;
      position: relative;
      padding: 8px;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--area-bg);
    }

    #board-wrapper {
      padding: var(--board-pad);
      background: var(--wrap-bg);
      border-radius: 24px;
      box-shadow: 0 1px 2px #0000000f,0 4px 12px #0000001a,0 12px 32px #00000024;
      cursor: grab;
      touch-action: none;
      transform-origin: center center;
      will-change: transform;
      border: 1px solid var(--border);
      animation: board-in .18s var(--md-ease);
    }

    body.dark #board-wrapper {
      box-shadow: 0 1px 2px #00000059,0 8px 24px #00000047;
    }

    #board {
      display: grid;
    }

    #board.big .cell {
      transition: none;
      border-radius: 0;
    }

    #board.big .cell:not(.revealed) {
      box-shadow: none;
    }

    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      font-size: var(--cell-font);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 1px solid var(--cell-border);
      border-radius: var(--radius-cell);
      background: var(--hidden);
      cursor: pointer;
      touch-action: manipulation;
      font-weight: 800;
      --gt: inset 0 0 0 0 rgba(255,255,255,0);
      --gr: inset 0 0 0 0 rgba(255,255,255,0);
      --gb: inset 0 0 0 0 rgba(255,255,255,0);
      --gl: inset 0 0 0 0 rgba(255,255,255,0);
      box-shadow: 0 1px 2px #0000001a,var(--gt),var(--gr),var(--gb),var(--gl);
      transition: transform .1s var(--md-ease);
    }

    .cell.edge-t {
      --gt: inset 0 3px 4px -3px rgba(255,255,255,.55);
    }

    .cell.edge-r {
      --gr: inset -3px 0 4px -3px rgba(255,255,255,.55);
    }

    .cell.edge-b {
      --gb: inset 0 -3px 4px -3px rgba(255,255,255,.55);
    }

    .cell.edge-l {
      --gl: inset 3px 0 4px -3px rgba(255,255,255,.55);
    }

    @media (hover:hover) {
      .cell:hover:not(.revealed):not(.flagged):not(.questioned) {
        background: var(--hover);
        transition: background-color .12s var(--md-ease),transform .1s var(--md-ease);
      }
    }

    .cell svg {
      pointer-events: none;
      z-index: 1;
    }

    .cell.flagged:before {
      content: "";
      width: 60%;
      height: 60%;
      background: var(--flag);
      clip-path: polygon(12% 0,62% 0,66% 12%,100% 12%,100% 64%,48% 64%,44% 52%,24% 52%,24% 100%,12% 100%);
      pointer-events: none;
      z-index: 1;
    }

    .cell.pressing {
      transform: scale(.92)!important;
      background: var(--warn-soft)!important;
      box-shadow: 0 0 0 2px var(--warn)!important;
    }

    .cell.revealed {
      background: var(--open);
      box-shadow: inset 0 1px 2px #0000001a;
      cursor: default;
      border-color: transparent;
    }

    .cell.flagged {
      background: var(--md-sys-color-primary-container);
      color: var(--flag);
      box-shadow: 0 1px 4px #6750a42e;
    }

    .cell.questioned {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }

    .cell.mine-show {
      background: var(--mine-bg);
      color: var(--mine-fg);
    }

    .cell.exploded {
      background: var(--boom);
      color: #fff;
    }

    .cell.wrong-flag {
      background: var(--wrong);
    }

    .cell.hint {
      box-shadow: 0 0 0 2.5px var(--accent)!important;
      z-index: 1;
    }

    .cell.hint-dim {
      box-shadow: 0 0 0 2px var(--md-sys-color-outline)!important;
      opacity: .72;
    }

    .cell.kb-focus {
      outline: 3px solid var(--accent);
      outline-offset: -2px;
      z-index: 1;
    }

    @keyframes board-in {
      0% {
        opacity: 0;
        transform: scale(.98);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes cell-pop {
      0% {
        transform: scale(.84);
        opacity: .42;
      }

      55% {
        transform: scale(1.045);
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes flag-spring {
      0% {
        transform: scale(0) rotate(-35deg);
      }

      65% {
        transform: scale(1.18) rotate(7deg);
      }

      to {
        transform: scale(1) rotate(0);
      }
    }

    @keyframes explode-pulse {
      0% {
        transform: scale(1);
      }

      35% {
        transform: scale(1.25);
      }

      70% {
        transform: scale(.96);
      }

      to {
        transform: scale(1);
      }
    }

    @keyframes ring {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      to {
        transform: scale(2.2);
        opacity: 0;
      }
    }

    @keyframes win-dance {
      0%,
      to {
        transform: scale(1);
      }

      35% {
        transform: scale(1.12) rotate(6deg);
      }

      70% {
        transform: scale(1.05) rotate(-4deg);
      }
    }

    .cell.anim-reveal {
      animation: reveal-pop .26s var(--md-ease) both;
    }

    @keyframes reveal-pop {
      0% {
        transform: scale(.62);
        opacity: 0;
      }

      60% {
        transform: scale(1.06);
        opacity: 1;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .cell.anim-flag:before {
      animation: flag-spring .18s cubic-bezier(.2,0,0,1) forwards;
    }

    .cell.anim-unflag {
      animation: cell-pop .12s var(--md-ease);
    }

    .cell.anim-explode {
      animation: explode-pulse .35s var(--md-ease);
    }

    .cell.anim-explode:after,
    .cell.hint-flash:after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      animation: ring .6s var(--md-ease) both;
    }

    .cell.anim-explode:after {
      box-shadow: 0 0 0 3px #b3261e8c;
    }

    .cell.hint-flash:after {
      box-shadow: 0 0 0 3px color-mix(in srgb,var(--accent) 60%,transparent);
      animation-duration: 1s;
    }

    .cell.win-flag:before {
      animation: win-dance .7s ease-in-out 4;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 600;
      display: none;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--vvh,100dvh);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      background: #00000080;
      transition: .22s opacity,.22s visibility;
    }

    .overlay.show {
      opacity: 1;
      visibility: visible;
    }

    #modal {
      z-index: 100;
    }

    #settings-overlay {
      z-index: 200;
      background: #0000008c;
    }

    .modal-content,
    .settings-panel {
      width: min(94vw,560px);
      max-height: 88vh;
      overflow: hidden;
      padding: 0;
      border: 0;
      border-radius: 28px;
      background: var(--md-sys-color-surface-container-low);
      box-shadow: 0 8px 12px #00000024,0 24px 48px #0000002e;
    }

    .settings-panel {
      display: flex;
      flex-direction: column;
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 20px 10px;
      background: var(--md-sys-color-surface-container-low);
      border-bottom: 1px solid color-mix(in srgb,var(--border) 58%,transparent);
    }

    .settings-header h3 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.15;
    }

    .settings-content {
      overflow: auto;
      padding: 12px 16px 16px;
      scrollbar-width: thin;
    }

    .settings-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .settings-section {
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 24px;
      background: var(--md-sys-color-surface-container);
      overflow: hidden;
      box-shadow: 0 1px 2px #0000000f;
    }

    .settings-label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      padding: 12px 16px 8px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .2px;
    }

    .settings-label:before {
      content: "";
      display: block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .settings-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .settings-section>.custom-row,
    .settings-section>.range-row,
    .settings-section>.settings-buttons {
      margin-left: 16px;
      margin-right: 16px;
    }

    .settings-buttons.segmented {
      margin: 0 12px 12px;
      padding: 4px;
      border-radius: 999px;
      background: var(--md-sys-color-surface-container-high);
      border: 1px solid color-mix(in srgb,var(--border) 70%,transparent);
    }

    .settings-buttons.segmented .btn {
      flex: 1;
      min-width: 72px;
      border: 0;
      box-shadow: none;
      background: 0 0;
      color: var(--muted);
      padding: 8px 10px;
    }

    .settings-buttons.segmented .btn.active {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      box-shadow: 0 1px 2px #0000001a;
    }

    .setting-list,
    .settings-list {
      display: flex;
      flex-direction: column;

    .settings-list {
      margin: 0 12px 12px;
      border-radius: 18px;
      overflow: hidden;
      background: var(--md-sys-color-surface-container-high);
      border: 1px solid color-mix(in srgb,var(--border) 55%,transparent);
    }

    .setting-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      min-height: 44px;
      padding: 9px 12px;
      border: 0;
      border-bottom: 1px solid color-mix(in srgb,var(--border) 45%,transparent);
      background: 0 0;
      color: var(--fg);
      text-align: left;
      cursor: pointer;
      font: inherit;
      transition: background-color .16s var(--md-ease),transform .12s var(--md-ease);
    }

    .setting-option:last-child {
      border-bottom: 0;
    }

    .setting-option:hover {
      background: color-mix(in srgb,var(--md-sys-color-primary) 7%,transparent);
    }

    .setting-option:active {
      transform: scale(.99);
    }

    .setting-option span {
      font-size: 13px;
      font-weight: 700;
    }

    .setting-option small {
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      white-space: nowrap;
    }

    .setting-option.active {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }

    .setting-option.active small {
      color: color-mix(in srgb,var(--md-sys-color-on-secondary-container) 72%,transparent);
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      min-height: 42px;
      padding: 9px 16px;
      border-top: 1px solid color-mix(in srgb,var(--border) 45%,transparent);
    }

    .toggle-row label:first-child {
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
    }

    .toggle-switch {
      position: relative;
      width: 52px;
      height: 32px;
      flex-shrink: 0;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--md-sys-color-surface-container-highest);
      border: 2px solid var(--md-sys-color-outline);
      border-radius: 99px;
      cursor: pointer;
      transition: .18s background-color,.18s border-color;
    }

    .toggle-track:before {
      content: "";
      position: absolute;
      left: 4px;
      top: 4px;
      width: 20px;
      height: 20px;
      background: var(--md-sys-color-outline);
      border-radius: 50%;
      transition: .18s transform,.18s background-color;
    }

    .toggle-switch input:checked+.toggle-track {
      background: var(--accent);
      border-color: var(--accent);
    }

    .toggle-switch input:checked+.toggle-track:before {
      transform: translate(20px);
      background: var(--md-sys-color-on-primary);
    }

    .toggle-switch input:focus-visible+.toggle-track {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .board-row {
      display: contents;
    }

    .custom-fields {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin: 0 12px 12px;
      padding: 10px;
      border-radius: 20px;
      background: color-mix(in srgb,var(--md-sys-color-surface-container-high) 82%,transparent);
    }

    .custom-fields.show {
      display: flex;
      animation: section-in .18s var(--md-ease) both;
    }

    .custom-form {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 8px;
    }

    .custom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .custom-form .custom-row {
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
    }

    .custom-row label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }

    .custom-row input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--md-sys-color-surface-container-lowest);
      color: var(--fg);
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      outline: 0;
    }

    .custom-row input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent);
    }

    .custom-row input.invalid {
      border-color: var(--md-sys-color-error);
      box-shadow: 0 0 0 3px color-mix(in srgb,var(--md-sys-color-error) 18%,transparent);
    }

    #mines-max-hint {
      margin-left: 4px;
      color: var(--muted);
      font-weight: 400;
    }

    #btn-apply-custom {
      width: 100%;
      padding: 11px 16px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--md-sys-color-on-primary);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 1px 2px #0000002e;
    }

    #btn-apply-custom:hover {
      background: var(--accent-hover);
    }

    .range-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 0;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 20px;
      background: var(--md-sys-color-surface-container-high);
    }

    #noguess-time-row {
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 20px;
      background: var(--md-sys-color-surface-container-high);
    }

    #noguess-time-row label {
      color: var(--fg);
      font-size: 13px;
      font-weight: 700;
    }

    #noguess-time-row input {
      width: 96px;
    }

    .range-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .range-head span {
      padding: 3px 8px;
      border-radius: 999px;
      background: color-mix(in srgb,var(--accent) 12%,transparent);
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
    }

    .range-input {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      appearance: none;
      background: linear-gradient(90deg,var(--accent) 0,var(--accent) var(--range-fill,50%),var(--md-sys-color-surface-container-highest) var(--range-fill,50%),var(--md-sys-color-surface-container-highest) 100%);
      outline: 0;
    }

    .range-input::-webkit-slider-thumb {
      appearance: none;
      width: 22px;
      height: 22px;
      border: 3px solid var(--md-sys-color-surface-container-lowest);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 2px 6px #00000040;
      cursor: pointer;
    }

    .range-input::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border: 3px solid var(--md-sys-color-surface-container-lowest);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 2px 6px #00000040;
      cursor: pointer;
    }

    .density-hint {
      display: none;
      margin: 2px 0 0;
      padding: 8px 10px;
      border-radius: 14px;
      font-size: 12px;
      line-height: 1.4;
    }

    .density-hint.warn {
      display: block;
      background: var(--warn-soft);
      color: color-mix(in srgb,var(--warn) 50%,var(--fg));
    }

    .density-hint.error {
      display: block;
      background: var(--mine-bg);
      color: var(--mine-fg);
    }

    #modal .modal-content {
      width: min(92vw,420px);
      max-height: min(86vh,calc(var(--vvh,100dvh) - 16px));
      overflow-y: auto;
      overscroll-behavior: contain;
      display: block;
    }

    #modal.show .modal-content {
      animation: modal-in .24s var(--md-ease) both;
    }

    .modal-icon-wrap {
      padding: 24px 24px 8px;
      display: flex;
      justify-content: flex-start;
    }

    .modal-icon-circle {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: var(--md-sys-color-surface-container-high);
      color: var(--fg);
    }

    #modal.show .modal-icon-circle {
      animation: icon-pop .34s cubic-bezier(.2,0,0,1) both;
    }

    .modal-icon-circle svg {
      width: 44px;
      height: 44px;
    }

    .modal-icon-circle.icon-loss {
      background: var(--mine-bg);
      color: var(--mine-fg);
    }

    .modal-icon-circle.icon-win {
      background: var(--md-sys-color-tertiary-container);
      color: var(--fg);
    }

    .modal-text-section {
      padding: 0 24px 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .modal-title-col {
      min-width: 0;
      flex: 1;
    }

    .modal-quick-stats {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-top: 6px;
    }

    .quick-stat {
      display: flex;
      justify-content: flex-end;
      align-items: baseline;
      gap: 7px;
      text-align: right;
    }

    .quick-stat-label {
      font-size: 10px;
      color: var(--muted);
      font-weight: 600;
      white-space: nowrap;
    }

    .quick-stat-value {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.2;
      color: var(--fg);
      white-space: nowrap;
    }

    .modal-badge-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .modal-text-section h2 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.18;
      font-weight: 800;
    }

    .modal-text-section p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }

    .modal-stats-section {
      padding: 0 24px 10px;
    }

    .modal-stats {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 8px;
    }

    .modal-stat-card {
      min-width: 0;
      padding: 10px 8px;
      border-radius: 16px;
      background: var(--md-sys-color-surface-container);
      text-align: center;
      animation: section-in .22s var(--md-ease) both;
    }

    .modal-stat-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 3px;
    }

    .modal-stat-value {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.15;
      word-break: break-word;
    }

    .modal-stat-unit {
      font-size: 11px;
      font-weight: 600;
    }

    .modal-actions-section {
      padding: 8px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-actions-section .btn,
    .modal-actions-section .btn-primary {
      width: 100%;
      min-height: 44px;
      justify-content: center;
      font-size: 15px;
    }

    .new-record-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--md-sys-color-tertiary-container);
      font-size: 11px;
      font-weight: 800;
    }

    @keyframes modal-in {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes icon-pop {
      0% {
        opacity: 0;
        transform: scale(.55) rotate(-10deg);
      }

      70% {
        transform: scale(1.08) rotate(3deg);
      }

      to {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }

    @keyframes section-in {
      0% {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width:420px) {
      #modal .modal-content {
        width: min(94vw,380px);
        border-radius: 24px;
      }

      .modal-icon-wrap {
        padding: 20px 20px 6px;
      }

      .modal-stats-section,
      .modal-text-section {
        padding-left: 20px;
        padding-right: 20px;
      }

      .modal-actions-section {
        padding: 8px 20px 20px;
      }

      .modal-text-section h2 {
        font-size: 24px;
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation-duration: 0s!important;
        transition-duration: 0s!important;
      }
    }

    #status-toast {
      position: fixed;
      left: 12px;
      right: 12px;
      top: calc(var(--vvh,100dvh) - env(safe-area-inset-bottom,0px) - 64px);
      z-index: 500;
      box-sizing: border-box;
      padding: 10px 14px;
      border-radius: 16px;
      background: var(--md-sys-color-surface-container-high);
      color: var(--fg);
      box-shadow: 0 8px 28px #0000002e;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity .2s var(--md-ease),transform .2s var(--md-ease);
    }

    #status-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width:640px) {
      #top-bar {
        padding: 7px 8px;
        gap: 5px;
      }

      #top-bar-actions,
      #top-bar-stats {
        gap: 4px;
      }

      .stat-item {
        padding: 3px 5px;
      }

      .btn {
        padding: 7px 12px;
      }

      .icon-btn {
        width: 36px;
      }
    }
  </style>
</head>
