      }
      const getNoguessWorkers = () => {
        if (!noguessWorkers) {
          noguessWorkers = Array.from({ length: WORKER_COUNT }, (_item, slot) => spawnNoguessWorker(slot));
        }
        return noguessWorkers;
      };

      function cancelWorkerSlot(slot) {
        if (pendingCallbacks[slot] !== null) {
          pendingCallbacks[slot](null);
          pendingCallbacks[slot] = null;
          pendingIds[slot] = 0;
          if (noguessWorkers?.[slot]) {
            noguessWorkers[slot].terminate();
            noguessWorkers[slot] = spawnNoguessWorker(slot);
          }
        }
      }

      function cancelAllWorkerChecks() {
        for (let slot = 0; slot < pendingCallbacks.length; slot++) {
          cancelWorkerSlot(slot);
        }
      }

      function checkBoardsInWorkers(candidates, rows, cols, mines, startRow, startCol) {
        const workers = getNoguessWorkers();
        return new Promise(resolve => {
          let remaining = candidates.length;
          let done = false;
          const finish = result => {
            if (!done) {
              done = true;
              resolve(result);
            }
          };
          candidates.forEach((candidate, slot) => {
            cancelWorkerSlot(slot);
            const requestId = ++noguessRequestId;
            pendingIds[slot] = requestId;
            pendingCallbacks[slot] = result => {
              if (!done) {
                if (result === null) {
                  finish(null);
                } else if (result !== true) {
                  if (--remaining === 0) {
                    finish(false);
                  }
                } else {
                  finish(candidate);
                }
              }
            };
            workers[slot].postMessage({
              mode: "check",
              id: requestId,
              board: candidate,
              rows,
              cols,
              mines,
              startRow,
              startCol,
              ...SOLVER_LIMITS
            });
          });
        });
      }

      async function generateMines(firstRow, firstCol, gameId) {
        const safeZone = safeZoneIndices(firstRow, firstCol);
        if (state.mode !== "noguess") {
          placeMines(safeZone);
          return;
        }
        let attempts = 0;
        const budgetMs = Math.round(1000 * normalizePositiveNumber(state.noguessTimeSeconds));
        const startedAt = Date.now();
        const remainingMs = () => Math.max(0, budgetMs - (Date.now() - startedAt));
        const showProgress = () => {
          if (state.gameId === gameId) {
            showToast(`⚙ 生成无猜棋盘… 剩余 ${ (remainingMs() / 1000).toFixed(1) }s${ attempts > 0 ? `·第${ attempts }轮` : "" } · ${ WORKER_COUNT } 线程`, 0);
          }
        };
        showProgress();
        const progressTimer = setInterval(showProgress, 500);
        try {
          for (;;) {
            if (state.gameId !== gameId) {
              return cancelAllWorkerChecks();
            }
            if (remainingMs() <= 0) {
              throw new Error("超时");
            }
            const candidates = Array.from({ length: WORKER_COUNT }, () => {
              placeMines(safeZone, { skipBV3: true });
              return state.board.map(row => row.slice());
            });
            attempts++;
            showProgress();
            if (state.gameId !== gameId) {
              return cancelAllWorkerChecks();
            }
            if (remainingMs() <= 0) {
              throw new Error("超时");
            }
            let winner;
            let timeoutId;
            const timeoutPromise = new Promise((resolve, reject) => {
              timeoutId = setTimeout(() => {
                reject(new Error("超时"));
                cancelAllWorkerChecks();
              }, remainingMs());
            });
            try {
              winner = await Promise.race([checkBoardsInWorkers(candidates, state.rows, state.cols, state.mines, firstRow, firstCol), timeoutPromise]);
            } finally {
              clearTimeout(timeoutId);
            }
            if (state.gameId !== gameId) {
              return cancelAllWorkerChecks();
            }
            if (winner === null) {
              throw new Error("生成中断");
            }
            if (winner !== false) {
              state.board = winner;
              state.bv3 = countBv3();
              cancelAllWorkerChecks();
              showToast("✓ 无猜棋盘已就绪", 2000);
              return;
            }
          }
        } finally {
          clearInterval(progressTimer);
        }
      }

      function checkWin() {
        if (state.revealedCount >= state.nonMineCount) {
          endGame(true);
        }
      }

      function endGame(won, hitRow = -1, hitCol = -1) {
        state.gameOver = true;
        if (state.timer) {
          syncTime(Date.now() - state.timerStart);
        }
        stopTimer();
        getSettlement();
        playFeedback(won ? "win" : "explode");
        if (won) {
          // Flags/modal wait for the running reveal wave; otherwise edge refreshes would
          // overwrite the win-flag animation and the modal could pop up mid-ripple.
          afterWave(() => {
            for (let row = 0; row < state.rows; row++) {
              for (let col = 0; col < state.cols; col++) {
                if (state.board[row][col] === -1 && !state.flagged[row][col]) {
                  state.flagged[row][col] = true;
                  state.flagCount++;
                  state.questioned[row][col] = false;
                  renderCell(row, col);
                  cellAt(row, col)?.classList.add("win-flag");
                }
              }
            }
            renderCounters();
            renderProgress();
            launchConfetti();
            runtime.timers.modal = setTimeout(() => showResultModal(true), 400);
          });
          return;
        }
        const hasHit = hitRow >= 0 && hitCol >= 0;
        const minesToReveal = [];
        const wrongFlags = [];
        for (let row = 0; row < state.rows; row++) {
          for (let col = 0; col < state.cols; col++) {
            if (state.board[row][col] !== -1 || state.flagged[row][col]) {
              if (state.board[row][col] !== -1 && state.flagged[row][col]) {
                wrongFlags.push([row, col]);
              }
            } else {
              state.questioned[row][col] = false;
              state.revealed[row][col] = true;
              if (!(hasHit && row === hitRow && col === hitCol)) {
                minesToReveal.push([row, col]);
              }
            }
          }
        }
        wrongFlags.forEach(([row, col]) => renderCell(row, col));
        if (hasHit) {
          renderCell(hitRow, hitCol);
          cellAt(hitRow, hitCol)?.classList.add("exploded", "anim-explode");
        }
        renderCounters();
        renderProgress();
        startWave(minesToReveal, hitRow, hitCol, () => {
          renderCounters();
          renderProgress();
          runtime.timers.modal = setTimeout(() => showResultModal(false), 120);
        }, { mineReveal: true, edgeSources: hasHit ? [[hitRow, hitCol]] : [] });
      }
      const statCardHtml = (label, value, unit) => `<div class="modal-stat-card"><div class="modal-stat-label">${ label }</div><div class="modal-stat-value">${ value }<small class="modal-stat-unit"> ${ unit }</small></div></div>`;
      const quickStatHtml = (label, value) => `<div class="quick-stat"><span class="quick-stat-label">${ label }</span><span class="quick-stat-value">${ value }</span></div>`;

      function formatTimeHtml(milliseconds) {
        return formatSeconds(Math.floor(milliseconds / 1000)) + "<span class=\"cs\">." + padTwoDigits(Math.floor(milliseconds % 1000 / 10)) + "</span>";
      }

      function showResultModal(won) {
        const settlement = state.settlement || getSettlement();
        dom.modalIconCircle.className = "modal-icon-circle " + (won ? "icon-win" : "icon-loss");
        dom.modalIcon.innerHTML = won ? MODAL_ICONS.check : MODAL_ICONS.bomb;
        dom.modalTitle.textContent = won ? "通关了" : "踩雷了！";
        dom.modalBadge.innerHTML = settlement.cheated ? "<span class=\"new-record-badge\">本局使用了辅助</span>" : "";
        const elapsedMs = state.timeMs || state.time * 1000;
        dom.modalQuickStats.innerHTML = quickStatHtml("3BV", state.bv3) + quickStatHtml("3BV/s", elapsedMs > 0 ? (state.bv3 / (elapsedMs / 1000)).toFixed(2) : "0.00") + quickStatHtml("IOE", state.usefulClicks > 0 ? (state.bv3 / state.usefulClicks).toFixed(2) : "0.00") + quickStatHtml("提示", state.hintsUsed + "次");
        dom.modalStats.className = "modal-stats";
        dom.modalStats.innerHTML = `<div class="modal-stat-card" style="grid-column:1/-1"><div class="modal-stat-label">用时</div><div class="modal-stat-value">${ formatTimeHtml(elapsedMs) }<small class="modal-stat-unit">${ elapsedMs < 60000 ? " 秒" : "" }</small></div></div>` + statCardHtml("插旗", state.flagCount, "个") + statCardHtml("有效点击", state.usefulClicks, "次");
        if (settlement.cheated) {
          dom.modalMessage.textContent = "使用了辅助。";
        } else if (won) {
          dom.modalMessage.textContent = "通关成功！";
        } else {
          dom.modalMessage.textContent = "再接再厉！";
        }
        dom.modal.classList.add("show");
      }

      function closeModal() {
        dom.modal.classList.remove("show");
        stopConfetti();
      }

      function bindAreaGestures() {
        dom.area.addEventListener("mousedown", event => {
          if (event.button !== 0) {
            return;
          }
          if (event.target.closest(".cell") && !state.gameOver && !state.placing) {
            if (!runtime.ignoreMouse) {
              const wrapRect = dom.wrapper.getBoundingClientRect();
              const areaRect = dom.area.getBoundingClientRect();
              if (wrapRect.width > areaRect.width || wrapRect.height > areaRect.height) {
                runtime.panArm = { x: event.clientX, y: event.clientY };
              }
            }
            return;
          }
          beginPan(event.clientX, event.clientY);
        });
        document.addEventListener("mousemove", event => {
          if (!runtime.pan) {
            if (!runtime.panArm) {
              return;
            }
            if (!(event.buttons & 1)) {
              runtime.panArm = null;
              return;
            }
            if (Math.hypot(event.clientX - runtime.panArm.x, event.clientY - runtime.panArm.y) < 8) {
              return;
            }
            beginPan(runtime.panArm.x, runtime.panArm.y);
            runtime.panArm = null;
          }
          const deltaX = event.clientX - runtime.pan.x;
          const deltaY = event.clientY - runtime.pan.y;
          if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
            runtime.moved = true;
          }
          runtime.offset = { x: runtime.pan.startOffsetX + deltaX, y: runtime.pan.startOffsetY + deltaY };
          schedulePan();
        });
        document.addEventListener("mouseup", clearPanState);
        dom.area.addEventListener("dblclick", event => {
          if (!event.target.closest(".cell")) {
            resetView();
          }
        });
        dom.area.addEventListener("wheel", event => {
          event.preventDefault();
          const newScale = clamp(runtime.scale * (event.deltaY < 0 ? 1.12 : 0.9), runtime.minScale, runtime.maxScale);
          if (newScale === runtime.scale) {
            return;
          }
          const rect = dom.wrapper.getBoundingClientRect();
          const centerOffsetX = event.clientX - (rect.left + rect.width / 2);
          const centerOffsetY = event.clientY - (rect.top + rect.height / 2);
          const ratio = 1 - newScale / runtime.scale;
          runtime.offset = { x: runtime.offset.x + centerOffsetX * ratio, y: runtime.offset.y + centerOffsetY * ratio };
          runtime.scale = newScale;
          applyTransform();
          releaseWillChange();
        }, { passive: false });
        dom.area.addEventListener("touchstart", event => {
          if (event.touches.length === 2) {
            const [touch1, touch2] = event.touches;
            runtime.pinch = {
              distance: Math.max(1, Math.hypot(touch2.clientX - touch1.clientX, touch2.clientY - touch1.clientY)),
              scale: runtime.scale,
              centerX: (touch1.clientX + touch2.clientX) / 2,
              centerY: (touch1.clientY + touch2.clientY) / 2
            };
            runtime.wasPinching = true;
            clearPanState();
            event.preventDefault();
          } else {
            if (event.touches.length === 1 && (!event.target.closest(".cell") || state.gameOver || state.placing)) {
              beginPan(event.touches[0].clientX, event.touches[0].clientY);
            }
          }
        }, { passive: false });
        document.addEventListener("touchmove", event => {
          if (runtime.pinch && event.touches.length >= 2) {
            const [touch1, touch2] = event.touches;
            const midX = (touch1.clientX + touch2.clientX) / 2;
            const midY = (touch1.clientY + touch2.clientY) / 2;
            const newScale = clamp(runtime.pinch.scale * Math.hypot(touch2.clientX - touch1.clientX, touch2.clientY - touch1.clientY) / runtime.pinch.distance, runtime.minScale, runtime.maxScale);
            const rect = dom.wrapper.getBoundingClientRect();
            const centerOffsetX = runtime.pinch.centerX - (rect.left + rect.width / 2);
            const centerOffsetY = runtime.pinch.centerY - (rect.top + rect.height / 2);
            const ratio = 1 - newScale / runtime.scale;
            runtime.offset = {
              x: runtime.offset.x + centerOffsetX * ratio + (midX - runtime.pinch.centerX),
              y: runtime.offset.y + centerOffsetY * ratio + (midY - runtime.pinch.centerY)
            };
            runtime.scale = newScale;
            runtime.pinch.centerX = midX;
            runtime.pinch.centerY = midY;
            applyTransform();
            releaseWillChange();
            return;
          }
          if (!runtime.pan || event.touches.length !== 1) {
            return;
          }
          const touch = event.touches[0];
          const deltaX = touch.clientX - runtime.pan.x;
          const deltaY = touch.clientY - runtime.pan.y;
          if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
            runtime.moved = true;
          }
          runtime.offset = { x: runtime.pan.startOffsetX + deltaX, y: runtime.pan.startOffsetY + deltaY };
          applyTransform();
        }, { passive: true });
        document.addEventListener("touchend", event => {
          if (runtime.pinch && event.touches.length < 2) {
            runtime.pinch = null;
          }
          if (!event.touches.length) {
            clearPanState();
          }
        }, { passive: true });
        document.addEventListener("touchcancel", () => {
          runtime.pinch = null;
          clearPanState();
        }, { passive: true });
      }

      function updateCustomHints() {
        const rows = parseInt(byId("c-rows").value, 10) || 0;
        const cols = parseInt(byId("c-cols").value, 10) || 0;
        const mines = parseInt(byId("c-mines").value, 10) || 0;
        const cellCount = Math.max(0, rows * cols);
        const density = cellCount ? Math.max(0, mines) / cellCount : 0;
        const maxMines = cellCount > 9 ? cellCount - 9 : 1;
        dom.maxMinesHint.textContent = cellCount > 9 ? `(最多 ${ maxMines })` : "";
        byId("c-mines").max = maxMines;
        dom.density.className = "density-hint";
        dom.density.textContent = "";
        if (cellCount) {
          if (density > 0.5) {
            dom.density.classList.add("error");
            dom.density.textContent = `⚠ 雷密度 ${ Math.round(100 * density) }%，过高`;
          } else if (cellCount <= 30 && mines > 0.3 * cellCount) {
            dom.density.classList.add("warn");
            dom.density.textContent = `格子较少（${ cellCount }格），建议降低雷数`;
          }
        }
      }

      function handleKeydown(event) {
        const settingsOpen = dom.settings.classList.contains("show");
        const key = event.key.toLowerCase();
        const noModifier = !event.ctrlKey && !event.metaKey;
        if (event.key === "Escape") {
          return settingsOpen ? closeSettings() : closeModal();
        }
        if ((event.ctrlKey || event.metaKey) && key === "z" && !event.shiftKey && !settingsOpen) {
          event.preventDefault();
          return undoMove();
        }
        if (key === "r" && noModifier && !settingsOpen) {
          closeModal();
          dom.settings.classList.remove("show");
          runtime.snap = null;
          return resetGame();
        }
        if (key === "h" && noModifier && !settingsOpen) {
          if (!isInteractionBlocked()) {
            useHint();
          }
          return;
        }
        if (isInteractionBlocked() || state.gameOver || state.placing || (event.key === " " || event.key === "Enter") && document.activeElement?.tagName === "BUTTON" || !(event.key in ARROW_KEY_DELTAS) && ![" ", "Enter", "f", "F"].includes(event.key)) {
          return;
        }
        event.preventDefault();
        if (!inBounds(state.keyboardRow, state.keyboardCol)) {
          state.keyboardRow = Math.floor(state.rows / 2);
          state.keyboardCol = Math.floor(state.cols / 2);
        }
        if (event.key in ARROW_KEY_DELTAS) {
          cellAt(state.keyboardRow, state.keyboardCol)?.classList.remove("kb-focus");
          const [deltaRow, deltaCol] = ARROW_KEY_DELTAS[event.key];
          state.keyboardRow = clamp(state.keyboardRow + deltaRow, 0, state.rows - 1);
          state.keyboardCol = clamp(state.keyboardCol + deltaCol, 0, state.cols - 1);
        } else {
          if (event.key === " " || event.key === "Enter") {
            if (isRevealedNumber(state.keyboardRow, state.keyboardCol)) {
              chordReveal(state.keyboardRow, state.keyboardCol);
            } else {
              revealCell(state.keyboardRow, state.keyboardCol);
            }
          } else if (key === "f") {
            toggleFlag(state.keyboardRow, state.keyboardCol);
          }
        }
        const focusCell = cellAt(state.keyboardRow, state.keyboardCol);
        if (focusCell) {
          focusCell.classList.add("kb-focus");
          scrollCellIntoView(focusCell, 40);
        }
      }

      function bindUi() {
        const clickHandlers = {
          "btn-newgame": resetGame,
          "btn-replay": () => {
            closeModal();
            resetGame();
          },
          "btn-close-modal": closeModal,
          "btn-settings": openSettings,
          "btn-close-settings": closeSettings,
          "btn-close-warning": () => {
            dom.warning.hidden = true;
          },
          "btn-undo-modal": undoMove,
          "btn-undo-topbar": undoMove,
          "btn-hint": useHint,
          "btn-apply-custom": () => {
            readCustomInputs({ selectDifficulty: true });
            runtime.snap = null;
            dom.settings.classList.remove("show");
            resetGame();
          },
          "btn-reset-settings"() {
            if (runtime.confirmReset) {
              clearTimeout(runtime.confirmReset);
              runtime.confirmReset = null;
              this.textContent = "重置所有设置";
              resetAllSettings();
              return;
            }
            this.textContent = "再点一次确认重置";
            runtime.confirmReset = setTimeout(() => {
              runtime.confirmReset = null;
              this.textContent = "重置所有设置";
            }, 3000);
          }
        };
        for (const [elementId, handler] of Object.entries(clickHandlers)) {
          byId(elementId)?.addEventListener("click", handler);
        }
        const changeBindings = [
          [
            "toggle-dark",
            "change",
            event => {
              runtime.darkManual = true;
              setDarkMode(event.target.checked);
              scheduleSaveSettings();
            }
          ],
          [
            "toggle-sound",
            "change",
            event => {
              state.soundEnabled = event.target.checked;
              scheduleSaveSettings();
            }
          ],
          [
            "toggle-question",
            "change",
            event => {
              state.questionMarkEnabled = event.target.checked;
              scheduleSaveSettings();
            }
          ],
          [
            "longpress-delay",
            "input",
            event => {
              syncLongPressUI(event.target.value);
              scheduleSaveSettings();
            }
          ],
          ["noguess-time-seconds", "input", event => handleNoguessTimeInput(event.target, false)],
          ["noguess-time-seconds", "blur", event => handleNoguessTimeInput(event.target, true)]
        ];
        for (const [elementId, eventName, handler] of changeBindings) {
          byId(elementId).addEventListener(eventName, handler);
        }
        ["c-rows", "c-cols", "c-mines"].forEach(elementId => byId(elementId).addEventListener("input", updateCustomHints));
        dom.settings.addEventListener("click", event => {
          const button = event.target.closest("[data-set]");
          if (button) {
            setOption(button.dataset.set, button.dataset.val);
          } else if (event.target === event.currentTarget) {
            closeSettings();
          }
        });
        dom.modal.addEventListener("click", event => {
          if (event.target === event.currentTarget) {
            closeModal();
          }
        });
        document.addEventListener("keydown", handleKeydown);
        document.addEventListener("click", event => {
          event.detail && event.target.closest?.("button")?.blur();
        });
        addEventListener("resize", () => {
          clearTimer("resize");
          runtime.timers.resize = setTimeout(() => layoutBoard(true), 100);
        });
        addEventListener("pagehide", () => {
          if (runtime.timers.save) {
            clearTimer("save");
            saveSettingsNow();
          }
          runtime.audio?.close();
        });
        bindAreaGestures();
      }
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", event => {
        if (!runtime.darkManual) {
          setDarkMode(event.matches);
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          if (state.timer && !state.gameOver) {
            syncTime(Date.now() - state.timerStart);
            stopTimer();
            runtime.hiddenPaused = true;
          }
        } else if (runtime.hiddenPaused) {
          runtime.hiddenPaused = false;
          if (!(state.timer || state.gameOver || state.firstClick || state.placing || runtime.settingsPaused || dom.settings.classList.contains("show"))) {
            startTimer();
          }
        }
      });

      function init() {
        loadSettings();
        bindUi();
        resetGame();
      }
      init();
    })();
  </script>
</body>
</html>
