.home-hero h1{margin:0;font-size:30px;line-height:1.1;font-weight:700}
#home-continue,.seg .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border:0;border-radius:16px;font-size:15px;box-shadow:none}
#home-continue[hidden],.seg .btn svg{display:none}
.home-label{margin:10px 4px 0;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.seg{display:flex;border:1px solid var(--md-sys-color-outline);border-radius:999px;overflow:hidden}
.seg .btn{flex:1;gap:6px;min-height:40px;padding:0 8px;border-radius:0;color:var(--fg);font-size:14px}
.seg .btn+.btn{border-left:1px solid var(--md-sys-color-outline)}
.home-nav button:active i,.home-nav button:hover i,.seg .btn.active{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.home-hint{margin:0 4px;font-size:12px;color:var(--muted)}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.home-nav button,.mode-card{position:relative;overflow:hidden;border-radius:16px;cursor:pointer}
.mode-card{display:flex;align-items:center;gap:12px;width:100%;padding:14px;text-align:left;border:1px solid transparent;background:var(--md-sys-color-surface-container-high);color:var(--fg);transition:background-color .16s var(--md-ease),transform .1s var(--md-ease)}
#home.show .mode-card{animation:homeIn .28s var(--md-ease) both}
.mode-card:active,.mode-card:hover{background:var(--md-sys-color-surface-container-highest)}
.mode-card:active{transform:scale(.97)}
.home-nav button i,.mc-icon{display:grid;place-items:center}
.mc-icon{flex:none;width:40px;height:40px;border-radius:12px;background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.mc-text{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.ach-tx b,.les b,.mc-text b{font-size:15px;font-weight:600}
.home-nav{position:sticky;bottom:0;margin:auto -16px 0;padding:10px 16px max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-around;background:var(--md-sys-color-surface-container)}
.home-nav button{padding:4px 8px;border:0;background:0 0;color:var(--muted);flex-direction:column;gap:4px;font-size:12px;font-weight:600;min-width:80px}
.home-nav button i{width:64px;height:32px;border-radius:16px;transition:background-color .16s var(--md-ease)}
#sub{z-index:95;background:var(--bg);align-items:flex-start;overflow-y:auto;color:var(--fg)}
.sub-panel{width:100%;max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px 28px;display:flex;flex-direction:column;gap:10px}
.home-nav button,.sub-head{display:flex;align-items:center}
.sub-head{gap:8px;padding:4px 0 6px}
.sub-head h2{margin:0;font-size:22px}
.sub-sum{margin:0 4px 4px;font-size:13px;color:var(--muted)}
.ach,.les{display:flex;padding:14px 16px;border-radius:20px;background:var(--md-sys-color-surface-container-high)}
.les{flex-direction:column;gap:8px}
.ach{flex-direction:row;align-items:center;gap:14px}
.ach.off{opacity:.6}
.ach-ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--md-sys-color-surface-container-highest)}
.ach:not(.off) .ach-ic{background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary)}
.ach.off .ach-ic{color:var(--muted)}
.ach-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ach-tx small,.les p{margin:0;font-size:12.5px;color:var(--muted)}
.bar{height:4px;border-radius:2px;background:var(--md-sys-color-surface-container-highest);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.lv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lv{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border:1px solid transparent;border-radius:16px;background:var(--md-sys-color-surface-container-high);color:var(--fg);cursor:pointer;font-size:20px;font-weight:700}
.lv small{font-size:11px;font-weight:500;color:var(--muted)}
.lv.done{background:var(--md-sys-color-primary-container)}
.lv.cur{border-color:var(--md-sys-color-primary)}
.lv:disabled{opacity:.4;cursor:default}
.dg,.dg .c{display:grid}
.dg{gap:3px;justify-content:center;margin:4px 0}
.dg .c{width:34px;height:34px;border-radius:6px;place-items:center;font-weight:700;background:var(--md-sys-color-surface-container-lowest)}
.dg .c.u{background:var(--hidden)}
.th-preview{padding:12px;border-radius:20px;background:var(--wrap-bg)}
.th-label{margin:18px 4px 8px;font-size:13px;font-weight:600;color:var(--muted)}
.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.th-card{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px 10px;border:2px solid transparent;border-radius:18px;background:var(--md-sys-color-surface-container-low);color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
.th-card.active{border-color:var(--accent);background:var(--md-sys-color-secondary-container)}
.th-sw{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--sw1) 50%,var(--sw2) 50%);box-shadow:inset 0 0 0 1px #0003}
.th-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.th-row input[type=color]{width:56px;height:44px;padding:0;border:0;border-radius:12px;background:0 0;cursor:pointer}
.th-hint{font-size:12px;color:var(--muted)}
.th-card:hover{background:var(--md-sys-color-surface-container-highest)}
.th-card.active:hover{background:var(--md-sys-color-secondary-container)}
.seg .btn:not(.active):hover{background:color-mix(in srgb,var(--md-sys-color-secondary-container) 45%,transparent)}
.home-keys{display:none;margin:4px 4px 0;font-size:12px;line-height:1.6;color:var(--muted);text-align:center}
@media (hover:hover) and (min-width:900px){
.home-keys{display:block}}
.th-row input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.th-row input[type=color]::-webkit-color-swatch{border:2px solid var(--border);border-radius:12px}
.th-row input[type=color]::-moz-color-swatch{border:2px solid var(--border);border-radius:12px}
#sub .btn,#sub .btn-close{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);pointer-events:none;animation:rip .55s var(--md-ease) forwards}
@media (min-width:900px) and (min-height:640px){
:root{--ui-zoom:1.2}}
@media (min-width:1400px) and (min-height:820px){
:root{--ui-zoom:1.4}}
@media (min-width:1900px) and (min-height:1000px){
:root{--ui-zoom:1.7}}
@media (min-width:2500px) and (min-height:1300px){
:root{--ui-zoom:2.1}}
@media (min-width:900px){
#back-confirm>div,#modal .modal-content,#top-bar,.home-panel,.settings-panel,.sub-panel{zoom:var(--ui-zoom, 1)}
.home-panel,.sub-panel{max-width:760px}
.home-panel{padding-inline:24px}
.home-hero{margin-top:auto}
.home-nav{margin-inline:-24px;padding-inline:24px;box-shadow:0 0 0 100vmax var(--md-sys-color-surface-container);clip-path:inset(0-100vmax)}
.home-grid{grid-template-columns:repeat(3,1fr)}
.th-grid{grid-template-columns:repeat(6,1fr)}
#top-bar{padding-inline:max(14px,calc((100% - 1100px/var(--ui-zoom, 1))/2))}
.settings-panel{max-height:calc(88vh/var(--ui-zoom, 1))}
#modal .modal-content{max-height:calc(86vh/var(--ui-zoom, 1))}
#status-toast{width:fit-content;max-width:90vw;margin-inline:auto}}

</style>
</head>
